name: SupplyChain-Decision-Platform CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  quality-tests-and-smoke-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (MLOps + Agent)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agent]"

      - name: Lint, Format & Type Check (Ruff + Mypy)
        run: |
          ruff check src/ scripts/ benchmarks/ tests/
          ruff format --check src/ scripts/ benchmarks/ tests/
          mypy src/

      - name: Run Unit, API, Guardrail & Benchmark Tests (No Network)
        run: |
          pytest tests/test_no_leakage.py \
                 tests/test_schemas.py \
                 tests/test_optimizer.py \
                 tests/test_api.py \
                 tests/test_agent_schemas.py \
                 tests/test_agent_tools.py \
                 tests/test_agent_orchestrator.py \
                 tests/test_agent_guardrails.py \
                 tests/test_telemetry.py \
                 tests/test_hitl_api.py \
                 tests/test_benchmark.py \
                 -v

      - name: Smoke Test Agent vs Baselines Benchmark (5 Scenarios)
        run: |
          python3 benchmarks/evaluate_agent_vs_baselines.py --smoke

      - name: Run End-to-End MLOps Smoke Test
        run: |
          pytest tests/test_smoke_train.py -m smoke -v
