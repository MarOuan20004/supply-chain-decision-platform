[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-decision-platform"
version = "1.0.0"
description = "End-to-End Supply Chain Analytics, Calibrated CatBoost MLOps API & Bounded Decision Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Marwane Hajjy", email = "marwane.hajjy@grenoble-inp.org"}
]
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "scipy>=1.13.0,<2.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "catboost>=1.2.5,<2.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "sqlalchemy>=2.0.0,<2.1.0",
    "mlflow>=2.14.0,<3.0.0",
]

[project.optional-dependencies]
agent = [
    "openai>=1.35.0,<2.0.0",
]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "smoke: fast end-to-end training and registry smoke tests (< 20s)",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
